<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DualSense Hardware Monitor</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="dashboard">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="brand">DUALSENSE</span>
        <span class="sub">MONITOR & CALIBRATION</span>
      </div>
      <div class="status-badge connected" id="statusBadge">
        <span class="dot"></span>
        <span id="statusText">DISPOSITIVO CONECTADO</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="grid-container">
      
      <!-- Card Analógicos -->
      <section class="card analog-card">
        <h2>ANALÓGICOS</h2>
        <div class="sticks-wrapper">
          <!-- Analógico Esquerdo -->
          <div class="stick-box">
            <h3>ESQUERDO (LS)</h3>
            <div class="stick-visual">
              <div class="stick-dot" id="stickLeftDot"></div>
            </div>
            <div class="metrics">
              <span>X: <strong id="valLX">128</strong></span>
              <span>Y: <strong id="valLY">128</strong></span>
            </div>
          </div>

          <!-- Analógico Direito -->
          <div class="stick-box">
            <h3>DIREITO (RS)</h3>
            <div class="stick-visual">
              <div class="stick-dot" id="stickRightDot"></div>
            </div>
            <div class="metrics">
              <span>X: <strong id="valRX">128</strong></span>
              <span>Y: <strong id="valRY">128</strong></span>
            </div>
          </div>
        </div>
      </section>

      <!-- Card Gatilhos -->
      <section class="card triggers-card">
        <h2>GATILHOS (L2 / R2)</h2>
        <div class="triggers-wrapper">
          <!-- L2 -->
          <div class="trigger-box">
            <div class="trigger-header">
              <span>L2</span>
              <strong id="valL2">0%</strong>
            </div>
            <div class="bar-bg">
              <div class="bar-fill" id="barL2" style="height: 0%;"></div>
            </div>
            <span class="click-indicator" id="clickL2">DIGITAL CLICK</span>
          </div>

          <!-- R2 -->
          <div class="trigger-box">
            <div class="trigger-header">
              <span>R2</span>
              <strong id="valR2">0%</strong>
            </div>
            <div class="bar-bg">
              <div class="bar-fill" id="barR2" style="height: 0%;"></div>
            </div>
            <span class="click-indicator" id="clickR2">DIGITAL CLICK</span>
          </div>
        </div>
      </section>

      <!-- Card D-Pad & Ações -->
      <section class="card buttons-card">
        <h2>MAPPING & BOTOES</h2>
        <div class="buttons-wrapper">
          
          <!-- D-Pad -->
          <div class="dpad-box">
            <h3>D-PAD</h3>
            <div class="dpad-cross">
              <div class="dpad-btn up" id="dpadUp">▲</div>
              <div class="dpad-middle">
                <div class="dpad-btn left" id="dpadLeft">◄</div>
                <div class="dpad-center"></div>
                <div class="dpad-btn right" id="dpadRight">►</div>
              </div>
              <div class="dpad-btn down" id="dpadDown">▼</div>
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="actions-box">
            <h3>AÇÕES</h3>
            <div class="action-cross">
              <div class="action-btn triangle" id="btnTriangle">Δ</div>
              <div class="action-middle">
                <div class="action-btn square" id="btnSquare">□</div>
                <div class="action-btn circle" id="btnCircle">O</div>
              </div>
              <div class="action-btn cross-btn" id="btnCross">✕</div>
            </div>
          </div>

        </div>
      </section>

    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
